<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#4338ca"/>
        </linearGradient>
        <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fb923c"/>
            <stop offset="100%" stop-color="#ea580c"/>
        </linearGradient>
    </defs>
    <!-- Fondo redondeado estilo App Icon iOS/Android -->
    <rect width="512" height="512" rx="112" fill="url(#grad)"/>
    
    <!-- Círculo interior sutil -->
    <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="12" stroke-dasharray="8 8"/>
    
    <!-- Reloj / Temporizador estilizado -->
    <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-width="20"/>
    <line x1="256" y1="256" x2="256" y2="160" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
    <line x1="256" y1="256" x2="330" y2="256" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="14" fill="#ffffff"/>
    
    <!-- Pequeña llama de racha decorativa -->
    <g transform="translate(320, 110) scale(0.9)">
        <circle cx="40" cy="40" r="46" fill="#ffffff" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.2))"/>
        <path d="M40 8 C30 25 15 38 15 54 C15 70 26 80 40 80 C54 80 65 70 65 54 C65 40 50 25 40 8 Z" fill="url(#flameGrad)"/>
        <path d="M40 38 C35 48 30 55 30 63 C30 70 34 74 40 74 C46 74 50 70 50 63 C50 56 45 48 40 38 Z" fill="#fef08a"/>
    </g>
</svg>

